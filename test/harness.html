<!DOCTYPE html>
<!--
  WHAT: fidelity test bench. Captures a domain's cookies, removes them, restores them,
  then compares before and after, field by field.

  WHY: this is the gate for the whole project. Until this bench reports zero deltas, no
  real domain should be trusted to the vault. We don't declare restore "faithful" because
  the code looks right: we run the round trip in an actual browser and read the result.

  HOW: load the extension via about:debugging, then click "Open fidelity bench" in the
  popup. Visit the test domain in a tab first, so there is something to capture.

  The logic lives in harness.js, NOT inline: extension pages run under a CSP that forbids
  inline scripts, and an inline block fails silently -- the button simply does nothing.

  ⚠️ Use a domain you DON'T CARE ABOUT. This bench really deletes the cookies before
  putting them back: a bug here logs you out of the site under test.
-->
<meta charset="utf-8">
<title>Lethoryale — fidelity bench</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  input, button { font: inherit; padding: .4rem .6rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid currentColor; padding: .3rem .5rem; text-align: left; }
  .ok { color: #0a0; font-weight: bold; }
  .ko { color: #c00; font-weight: bold; }
  pre { white-space: pre-wrap; }
</style>

<h1>Fidelity bench</h1>
<p>
  Full round trip on one domain: <strong>capture → remove → restore → compare</strong>.
  The test passes only when the delta table is empty.
</p>
<p>
  <label>Domain: <input id="domain" size="30" placeholder="example.com"></label>
  <button id="run">Run round trip</button>
</p>
<div id="out"></div>

<script type="module" src="harness.js"></script>
